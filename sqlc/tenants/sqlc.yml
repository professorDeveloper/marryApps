version: "2"
sql:
  - engine: "postgresql"
    queries: "./queries"
    schema:
      - "../../app/migrations/tenants/1_core.up.sql"
      - "../../app/migrations/tenants/2_catalog.up.sql"
      - "../../app/migrations/tenants/3_ingredients.up.sql"
      - "../../app/migrations/tenants/4_supply.up.sql"
      - "../../app/migrations/tenants/5_goods.up.sql"
      - "../../app/migrations/tenants/6_orders.up.sql"
      - "../../app/migrations/tenants/7_inventory.up.sql"
      - "../../app/migrations/tenants/8_movements.up.sql"
      - "../../app/migrations/tenants/9_extras.up.sql"
      - "../../app/migrations/tenants/10_seed.up.sql"
      - "../../app/migrations/tenants/11_transaction_category.up.sql"
      - "../../app/migrations/tenants/12_transaction_type_update.up.sql"
      - "../../app/migrations/tenants/13_shipments.up.sql"
      - "../../app/migrations/tenants/14_order_item_cost_price.up.sql"
      - "../../app/migrations/tenants/15_order_paid_amount.up.sql"
      - "../../app/migrations/tenants/16_transaction_paid_amount.up.sql"
      - "../../app/migrations/tenants/17_outgoing_invoices.up.sql"
      - "../../app/migrations/tenants/18_separation_acts.up.sql"


    gen:
      go:
        emit_json_tags: true
        emit_pointers_for_null_types: true
        package: "pg"
        out: "../../app/internal/repository/pg/tenantsdb"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
