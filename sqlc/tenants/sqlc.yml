      - "../../app/migrations/tenants/6_Ingredients.up.sql"
      - "../../app/migrations/tenants/7_invoices_supplier.up.sql"
      - "../../app/migrations/tenants/8_compound.up.sql"
      - "../../app/migrations/tenants/9_goods.up.sql"
      - "../../app/migrations/tenants/10_orders.up.sql"
      - "../../app/migrations/tenants/11_create_calculation_table.up.sql"
      - "../../app/migrations/tenants/12_ui_layout.up.sql"
      - "../../app/migrations/tenants/13_inventories.up.sql"
