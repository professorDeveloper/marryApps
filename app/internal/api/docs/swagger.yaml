        name: lang
        type: string
      - description: Start date/time (RFC3339 or YYYY-MM-DD)
        in: query
        name: start
        type: string
      - description: End date/time (RFC3339 or YYYY-MM-DD)
        in: query
        name: end
        type: string
      - description: Bill number to search within the date range
        in: query
        name: bill_no
        type: integer
      - description: Bill status (opened, closed, paid)
        in: query
        name: bill_status
        type: string
      - description: Payment type (cash, card)
        in: query
        name: payment_type
        type: string
      - description: Waiter ID (UUID)
        in: query
        name: waiter_id
        type: string
      - description: Hall ID (UUID)
        in: query
        name: hall_id
        type: string
      - description: Table ID (UUID)
        in: query
        name: table_id
        type: string
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      - description: 'Expand relations (comma-separated: user_id, hall_id, table_id,
