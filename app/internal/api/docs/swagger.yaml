basePath: /
definitions:
  model.CreateInvoiceResponse:
    properties:
      data:
        properties:
          id:
            type: string
          payment_url:
            type: string
        type: object
      error:
        type: integer
      error_note:
        type: string
    type: object
  model.CreatePriceForLevelRequest:
    properties:
      amount:
        type: integer
      level:
        type: string
    type: object
  model.CreatePriceForLevelResponse:
    properties:
      data:
        $ref: '#/definitions/model.PriceForLevelResponse'
      error:
        type: integer
      error_note:
        type: string
    type: object
  model.ErrorResponse:
    properties:
      message:
        example: error message
        type: string
    type: object
  model.GoogleAuthRequest:
    properties:
      app_type:
        type: string
      id_token:
        type: string
    type: object
  model.IndexCreation:
    properties:
      provider:
        type: string
    type: object
  model.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      phoneNumber:
        example: "1234567890"
        type: string
    type: object
  model.LoginResponse:
    properties:
      accessToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/model.UserResponse'
    type: object
  model.PriceForLevelResponse:
    properties:
      amount:
        type: integer
      id:
        type: string
      level:
        type: string
    type: object
  model.RefreshRequest:
    properties:
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  model.RefreshResponse:
    properties:
      accessToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  model.RegisterRequest:
    properties:
      fullName:
        type: string
      password:
        type: string
      phoneNumber:
        type: string
    type: object
  model.SuccessResponse:
    properties:
      message:
        example: Password updated successfully
        type: string
    type: object
  model.UpdatePasswordRequest:
    properties:
      currentPassword:
        example: password123
        type: string
      newPassword:
        example: newPassword123
        type: string
    type: object
  model.UpdateUserRequest:
    properties:
      XP:
        type: integer
      balance:
        type: integer
      dateOfBirth:
        type: string
      email:
        type: string
      fullName:
        type: string
      gender:
        type: string
      group:
        type: string
      isAgreedForUserContract:
        type: boolean
      isVerified:
        type: boolean
      level:
        type: string
      overAll:
        type: integer
      phoneNumber:
        type: string
      photo:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  model.UserResponse:
    properties:
      balance:
        example: 1000
        type: integer
      dateOfBirth:
        example: "2022-01-01T00:00:00Z"
        type: string
      email:
        example: user@example.com
        type: string
      fullName:
        example: John Doe
        type: string
      gender:
        example: male
        type: string
      group:
        example: group_1
        type: string
      id:
        example: "1234567890"
        type: string
      isAgreedForUserContract:
        example: true
        type: boolean
      isVerified:
        example: true
        type: boolean
      level:
        example: level_1
        type: string
      overAll:
        example: 1
        type: integer
      phoneNumber:
        example: "+998901234567"
        type: string
      photo:
        example: https://example.com/photo.jpg
        type: string
      role:
        example: user
        type: string
      status:
        example: active
        type: string
      xp:
        example: 100
        type: integer
    type: object
host: back.blitz.yurtal.tech
info:
  contact: {}
  description: Blitz API server.
  title: Swagger Blitz API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access token
      parameters:
      - description: Login credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: User login
      tags:
      - Auth
  /api/v1/auth/login/with-google:
    post:
      consumes:
      - application/json
      description: Register a new user using Google and return token with user data
      parameters:
      - description: Google auth request
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.GoogleAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: User registration with Google
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh access token using refresh token
      parameters:
      - description: Refresh token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RefreshResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Token refresh
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user and return token with user data
      parameters:
      - description: Registration data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: User registration
      tags:
      - Auth
  /api/v1/level-price/create:
    post:
      consumes:
      - application/json
      description: Creates a new price for a specific level in the system
      parameters:
      - default: Bearer <your_token>
        description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Price level creation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreatePriceForLevelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully created price level
          schema:
            $ref: '#/definitions/model.CreatePriceForLevelResponse'
        "400":
          description: Invalid request or price level already exists
          schema:
            $ref: '#/definitions/model.CreatePriceForLevelResponse'
        "401":
          description: Unauthorized - Invalid or missing token
          schema:
            $ref: '#/definitions/model.CreatePriceForLevelResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/model.CreatePriceForLevelResponse'
      security:
      - ApiKeyAuth: []
      summary: Create a new price level
      tags:
      - level-prices
  /api/v1/payments/create:
    post:
      consumes:
      - application/json
      description: Creates a new payment invoice for the authenticated user
      parameters:
      - default: Bearer <your_token>
        description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Invoice creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.IndexCreation'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully created invoice
          schema:
            $ref: '#/definitions/model.CreateInvoiceResponse'
        "400":
          description: Invalid request or missing required fields
          schema:
            $ref: '#/definitions/model.CreateInvoiceResponse'
        "401":
          description: Unauthorized - User not authenticated
          schema:
            $ref: '#/definitions/model.CreateInvoiceResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/model.CreateInvoiceResponse'
      summary: Create a new payment invoice
      tags:
      - payments
  /api/v1/user/me:
    get:
      consumes:
      - application/json
      description: Get the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get current user profile
      tags:
      - users
  /api/v1/user/password:
    put:
      consumes:
      - application/json
      description: Update the password of the currently authenticated user
      parameters:
      - description: Password update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update user password
      tags:
      - users
  /api/v1/user/update:
    put:
      consumes:
      - application/json
      description: Update the profile of the currently authenticated user
      parameters:
      - description: User update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update user profile
      tags:
      - users
schemes:
- https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
