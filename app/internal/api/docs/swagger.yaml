basePath: /
definitions:
  model.CreateInvoiceResponse:
    properties:
      data:
        properties:
          id:
            type: string
          payment_url:
            type: string
        type: object
      error:
        type: integer
      error_note:
        type: string
    type: object
  model.CreatePriceForLevelRequest:
    properties:
      amount:
        type: integer
      level:
        type: string
    type: object
  model.CreatePriceForLevelResponse:
    properties:
      data:
        $ref: '#/definitions/model.PriceForLevelResponse'
      error:
        type: integer
      error_note:
        type: string
    type: object
  model.DownloadRequest:
    properties:
      object_name:
        example: c0f18a64-7f5c-4425-9414-1b01cddee9d9/avatar.png
        type: string
    type: object
  model.DownloadResponse:
    properties:
      object_name:
        example: c0f18a64-7f5c-4425-9414-1b01cddee9d9/avatar.png
        type: string
    type: object
  model.ErrorResponse:
    properties:
      message:
        example: error message
        type: string
    type: object
  model.GoogleAuthRequest:
    properties:
      app_type:
        type: string
      id_token:
        type: string
    type: object
  model.IndexCreation:
    properties:
      provider:
        type: string
    type: object
  model.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      phoneNumber:
        example: "1234567890"
        type: string
    type: object
  model.LoginResponse:
    properties:
      accessToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/model.UserResponse'
    type: object
  model.PriceForLevelResponse:
    properties:
      amount:
        type: integer
      id:
        type: string
      level:
        type: string
    type: object
  model.RefreshRequest:
    properties:
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  model.RefreshResponse:
    properties:
      accessToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  model.RegisterRequest:
    properties:
      fullName:
        type: string
      password:
        type: string
      phoneNumber:
        type: string
    type: object
  model.RegisterResponse:
    properties:
      message:
        type: string
    type: object
  model.SuccessResponse:
    properties:
      message:
        example: Password updated successfully
        type: string
    type: object
  model.UpdatePasswordRequest:
    properties:
      currentPassword:
        example: password123
        type: string
      newPassword:
        example: newPassword123
        type: string
    type: object
  model.UpdateUserRequest:
    properties:
      XP:
        type: integer
      balance:
        type: integer
      dateOfBirth:
        type: string
      email:
        type: string
      fullName:
        type: string
      gender:
        type: string
      group:
        type: string
      isAgreedForUserContract:
        type: boolean
      isVerified:
        type: boolean
      level:
        type: string
      overAll:
        type: integer
      phoneNumber:
        type: string
      photo:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  model.UserResponse:
    properties:
      balance:
        example: 1000
        type: integer
      dateOfBirth:
        example: "2022-01-01T00:00:00Z"
        type: string
      email:
        example: user@example.com
        type: string
      fullName:
        example: John Doe
        type: string
      gender:
        example: male
        type: string
      group:
        example: group_1
        type: string
      id:
        example: "1234567890"
        type: string
      isAgreedForUserContract:
        example: true
        type: boolean
      isVerified:
        example: true
        type: boolean
      level:
        example: level_1
        type: string
      overAll:
        example: 1
        type: integer
      phoneNumber:
        example: "+998901234567"
        type: string
      photo:
        example: https://example.com/photo.jpg
        type: string
      role:
        example: user
        type: string
      status:
        example: active
        type: string
      xp:
        example: 100
        type: integer
    type: object
host: back.blitz.yurtal.tech
info:
  contact: {}
  description: Blitz API server with multi-language support (de, uz)
  title: Blitz API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully logged in
          schema:
            $ref: '#/definitions/model.LoginResponse'
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: User login
      tags:
      - auth
  /api/v1/auth/login/with-google:
    post:
      consumes:
      - application/json
      description: Register a new user using Google and return token with user data
      parameters:
      - description: Google auth request
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.GoogleAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully authenticated with Google
          schema:
            $ref: '#/definitions/model.LoginResponse'
        "400":
          description: Invalid request body or app type
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Invalid Google ID Token
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: User registration with Google
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh access token using refresh token
      parameters:
      - description: Refresh token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed successfully
          schema:
            $ref: '#/definitions/model.RefreshResponse'
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Token refresh
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user and return token with user data
      parameters:
      - description: Registration data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User successfully registered
          schema:
            $ref: '#/definitions/model.RegisterResponse'
        "400":
          description: Invalid request or registration error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: User registration
      tags:
      - auth
  /api/v1/level-price/create:
    post:
      consumes:
      - application/json
      description: Creates a new price for a specific level in the system
      parameters:
      - default: Bearer <your_token>
        description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Price level creation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreatePriceForLevelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully created price level
          schema:
            $ref: '#/definitions/model.CreatePriceForLevelResponse'
        "400":
          description: Invalid request or price level already exists
          schema:
            $ref: '#/definitions/model.CreatePriceForLevelResponse'
        "401":
          description: Unauthorized - Invalid or missing token
          schema:
            $ref: '#/definitions/model.CreatePriceForLevelResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/model.CreatePriceForLevelResponse'
      summary: Create a new price level
      tags:
      - level-prices
  /api/v1/library/audio:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a user audio file
      parameters:
      - description: Audio file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Audio successfully uploaded
          schema:
            $ref: '#/definitions/model.DownloadResponse'
        "400":
          description: Invalid request or file not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Failed to process upload
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload user audio
      tags:
      - library
  /api/v1/library/audio/download:
    post:
      consumes:
      - application/json
      description: Downloads audio podcast by object name
      parameters:
      - description: Audio object name
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.DownloadRequest'
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Audio file
          schema:
            type: file
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Audio not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Failed to download file
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download user audio
      tags:
      - library
  /api/v1/library/book:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a book file
      parameters:
      - description: Book file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Book successfully uploaded
          schema:
            $ref: '#/definitions/model.DownloadResponse'
        "400":
          description: Invalid request or file not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Failed to process upload
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload book
      tags:
      - library
  /api/v1/library/book/download:
    post:
      consumes:
      - application/json
      description: Downloads a book by object name
      parameters:
      - description: Book object name
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.DownloadRequest'
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Book file
          schema:
            type: file
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Book not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Failed to download file
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download book
      tags:
      - library
  /api/v1/library/video:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a video file
      parameters:
      - description: Video file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Video successfully uploaded
          schema:
            $ref: '#/definitions/model.DownloadResponse'
        "400":
          description: Invalid request or file not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Failed to process upload
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload video
      tags:
      - library
  /api/v1/library/video/download:
    post:
      consumes:
      - application/json
      description: Downloads video by object name
      parameters:
      - description: Video object name
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.DownloadRequest'
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Video file
          schema:
            type: file
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Video not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Failed to download file
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download video
      tags:
      - library
  /api/v1/payments/create:
    post:
      consumes:
      - application/json
      description: Creates a new payment invoice for the authenticated user
      parameters:
      - default: Bearer <your_token>
        description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Invoice creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.IndexCreation'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully created invoice
          schema:
            $ref: '#/definitions/model.CreateInvoiceResponse'
        "400":
          description: Invalid request or missing required fields
          schema:
            $ref: '#/definitions/model.CreateInvoiceResponse'
        "401":
          description: Unauthorized - User not authenticated
          schema:
            $ref: '#/definitions/model.CreateInvoiceResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/model.CreateInvoiceResponse'
      summary: Create a new payment invoice
      tags:
      - payments
  /api/v1/user/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a user avatar image file
      parameters:
      - description: Image file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Avatar successfully uploaded
          schema:
            $ref: '#/definitions/model.DownloadResponse'
        "400":
          description: Invalid request or file not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Failed to process upload
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload user avatar
      tags:
      - users
  /api/v1/user/avatar/download:
    post:
      consumes:
      - application/json
      description: Downloads a user's avatar by object name
      parameters:
      - description: Avatar object name
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.DownloadRequest'
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Avatar image file
          schema:
            type: file
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Avatar not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Failed to download file
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download user avatar
      tags:
      - users
  /api/v1/user/me:
    get:
      consumes:
      - application/json
      description: Get the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: User profile retrieved successfully
          schema:
            $ref: '#/definitions/model.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - users
  /api/v1/user/password-update:
    put:
      consumes:
      - application/json
      description: Update the password of the currently authenticated user
      parameters:
      - description: Password update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated successfully
          schema:
            $ref: '#/definitions/model.SuccessResponse'
        "400":
          description: Invalid request format or user ID
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Failed to update password
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user password
      tags:
      - users
  /api/v1/user/update:
    put:
      consumes:
      - application/json
      description: Update the profile information of the currently authenticated user
      parameters:
      - description: User update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User profile updated successfully
          schema:
            $ref: '#/definitions/model.UserResponse'
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Failed to update user
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - users
schemes:
- https
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and your JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
