    get:
      description: Retrieve a compound with all its calculations and profit information
      parameters:
      - description: Compound ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.CompoundCalculationResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/model.ErrorData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorData'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/model.ErrorData'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/model.ErrorData'
      security:
      - BearerAuth: []
      summary: Get compound with calculations
      tags:
      - Calculations
    put:
      consumes:
      - application/json
      description: |-
        Update a compound and replace all its ingredient/child compound calculations in one atomic transaction.

        **How it works:**
        - Update the compound first
        - Delete all existing calculations for this compound
        - Create the new ingredient calculations (price from invoice_detail)
        - Create the new child compound calculations (price from child compound's price)
        - If any step fails, everything is rolled back
        - Compound price is auto-calculated as sum of all calculation total_costs
      parameters:
      - default: uz
        description: Language (uz, ru, en)
        in: query
        name: lang
        type: string
      - description: Compound ID
        in: path
        name: id
        required: true
        type: string
      - description: Compound update + ingredients + child compounds
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateCompoundWithCalculationsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Compound and all calculations updated successfully
          schema:
            $ref: '#/definitions/model.CompoundWithCalculationsResponse'
        "400":
          description: Invalid request (missing fields, invalid UUIDs, etc.)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal error (ingredient not found, no invoice, etc.)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update compound with multiple ingredients and child compounds (One
        Save)
      tags:
      - compounds
