    get:
      description: Retrieve a good with all its ingredient calculations and profit
        information
      parameters:
      - description: Good ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.GoodCalculationResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/model.ErrorData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorData'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/model.ErrorData'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/model.ErrorData'
      security:
      - BearerAuth: []
      summary: Get good with calculations
      tags:
      - Calculations
    put:
      consumes:
      - application/json
      description: |-
        Update a good/menu item and replace all its ingredient/compound calculations in one atomic transaction.

        **How it works:**
        - Update the good first
        - Delete all existing calculations for this good
        - Create the new ingredient calculations (price from invoice_detail)
        - Create the new compound calculations (price from compound.price)
        - If any step fails, everything is rolled back
      parameters:
      - default: uz
        description: Language (uz, ru, en)
        in: query
        name: lang
        type: string
      - description: Good ID
        in: path
        name: id
        required: true
        type: string
      - description: Good update + ingredients + compounds
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateGoodWithCalculationsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Good and all calculations updated successfully
          schema:
            $ref: '#/definitions/model.GoodWithCalculationsResponse'
        "400":
          description: Invalid request (missing fields, invalid UUIDs, etc.)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal error (ingredient not found, no invoice for ingredient,
            etc.)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update good with multiple ingredients and compounds (One Save)
      tags:
      - Goods
