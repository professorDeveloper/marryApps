  /api/v1/compounds/with-calculations:
    post:
      consumes:
      - application/json
      description: |-
        Create a new compound with its ingredient/child compound calculations in one atomic transaction.

        **How it works:**
        - Create the compound first
        - Then create all ingredient calculations (price from invoice_detail)
        - Then create all child compound calculations (price from child compound's price)
        - If any calculation fails, everything is rolled back (compound won't be created)
        - Compound price is auto-calculated as sum of all calculation total_costs

        **Example Request:**
        ```json
        {
        "compound": { "name": "Pizza Dough", "quantity": 1, "measurement": "kg" },
        "ingredient_calculations": [
        { "ingredient_id": "flour-uuid", "quantity": "0.5" },
        { "ingredient_id": "water-uuid", "quantity": "0.3" }
        ],
        "compound_calculations": [
        { "compound_id": "yeast-mix-uuid", "quantity": "1" }
        ]
        }
        ```
      parameters:
      - default: uz
        description: Language (uz, ru, en)
        in: query
        name: lang
        type: string
      - description: Compound + ingredients + child compounds
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateCompoundWithCalculationsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Compound and all calculations created successfully
          schema:
            $ref: '#/definitions/model.CompoundWithCalculationsResponse'
        "400":
          description: Invalid request (missing fields, invalid UUIDs, etc.)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal error (ingredient not found, no invoice, etc.)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create compound with multiple ingredients and child compounds (One
        Save)
      tags:
      - compounds
