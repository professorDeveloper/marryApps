name: Build POS (exe)

# APK Mac'da qo'lda yig'iladi:
#   flutter build apk --release --split-per-abi --target=lib/main_waiter.dart \
#     --dart-define=TRIAL_HOURS=36 --dart-define=TRIAL_DEADLINE=2026-08-20
#
# Bu yerda faqat Windows exe — uni Mac'da yig'ib bo'lmaydi.
on:
  workflow_dispatch:
    inputs:
      trial_hours:
        description: "Sinov muddati (soat). 36 = 1.5 kun"
        required: true
        default: "36"
      trial_deadline:
        description: "Mutlaq muddat, ISO-8601: 2026-08-20 yoki 2026-08-20T23:59:59+05:00. Bo'sh = mutlaq muddat yo'q"
        required: false
        default: "2026-08-20"
      trial_contact:
        description: "Qulf ekranidagi aloqa (telefon/Telegram). Bo'sh = faqat 'Contact to developer'"
        required: false
        default: ""
      trial_enabled:
        description: "Qulf yoqilganmi. Haqiqiy mijoz uchun false"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
  push:
    tags: ["v*"]

env:
  # Mahalliy mashinadagi versiya bilan bir xil — CI boshqa versiyada
  # yig'sa "menda ishlaydi" muammosi paydo bo'ladi.
  FLUTTER_VERSION: "3.41.6"
  WORKING_DIR: pos

jobs:
  # ── Testlar ─────────────────────────────────────────────────────────────────
  #
  # Ubuntu'da, Windows job'idan alohida. Sabab: Windows runner'da Flutter
  # test to'plamini kompilyatsiya qilish o'ta sekin (20+ daqiqa) va u yig'ishni
  # bekorga ushlab turadi. Test mantiqi platformaga bog'liq emas.
  test:
    name: Testlar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bog'liqliklar
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter pub get

      - name: Analiz
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      # `TRIAL_MINUTES=3` — muddat kompilyatsiya vaqtida qadaladi, test ichida
      # o'zgartirib bo'lmaydi. `TRIAL_MIRROR=off` — nusxa fayllar testlar
      # orasida bir-birini ifloslantirmasligi uchun.
      - name: Testlar
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter test --dart-define=TRIAL_MINUTES=3 --dart-define=TRIAL_MIRROR=off

  # ── Kassa ilovasi: Windows exe ──────────────────────────────────────────────
  windows:
    name: POS Windows exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bog'liqliklar
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter pub get

      # Versiya `pubspec.yaml` dan olinadi (`1.0.0+1` -> `1.0.0`). Teg
      # qo'yilgan bo'lsa teg ustun turadi — reliz nomi bilan o'rnatuvchi
      # nomi bir xil bo'lishi kerak.
      - name: Versiya aniqlash
        id: ver
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//' | tr -d '\r')
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "versiya: $v"

      - name: EXE yig'ish
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: |
          flutter build windows --release \
            --dart-define=TRIAL_ENABLED=${{ inputs.trial_enabled || 'true' }} \
            --dart-define=TRIAL_HOURS=${{ inputs.trial_hours || '36' }} \
            --dart-define=TRIAL_DEADLINE=${{ inputs.trial_deadline }} \
            --dart-define=TRIAL_CONTACT="${{ inputs.trial_contact }}"

      # ── O'rnatuvchi ─────────────────────────────────────────────────────────
      #
      # Inno Setup `windows-latest` obrazida oldindan bor. Bo'lmasa ham
      # to'xtab qolmaymiz — choco orqali o'rnatiladi.
      - name: Inno Setup tayyorligi
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup topilmadi — o'rnatilyapti"
            choco install innosetup -y --no-progress
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup.exe yig'ish
        working-directory: ${{ env.WORKING_DIR }}/windows/installer
        shell: pwsh
        run: |
          & "$env:ISCC" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "/DSourceDir=..\..\build\windows\x64\runner\Release" `
            installer.iss
          Get-ChildItem Output

      # ZIP ham qoldiriladi: o'rnatuvchisiz, portativ ishlatmoqchi bo'lganlar
      # uchun (masalan flesh-kartadan sinab ko'rish).
      - name: ZIP qilish
        working-directory: ${{ env.WORKING_DIR }}/build/windows/x64/runner
        shell: pwsh
        run: Compress-Archive -Path Release\* -DestinationPath MaryAI-POS-windows.zip

      - uses: actions/upload-artifact@v5
        with:
          name: pos-windows-setup
          path: ${{ env.WORKING_DIR }}/windows/installer/Output/*.exe
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v5
        with:
          name: pos-windows-portable
          path: ${{ env.WORKING_DIR }}/build/windows/x64/runner/MaryAI-POS-windows.zip
          if-no-files-found: error
          retention-days: 30

  # ── Teg qo'yilganda relizga qo'yamiz ────────────────────────────────────────
  release:
    name: Release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
